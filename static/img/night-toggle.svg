<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100" role="img" aria-label="Dark mode toggle, thumb on the left">
  <defs>
    <linearGradient id="nightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a9a"/>
      <stop offset="55%" stop-color="#3a3a7a"/>
      <stop offset="100%" stop-color="#24244a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="75%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </radialGradient>
    <radialGradient id="thumb" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#14141a"/>
    </radialGradient>
  </defs>
  <!-- capsule track -->
  <rect x="5" y="5" width="190" height="90" rx="45" ry="45" fill="url(#nightBg)" stroke="#1a1a24" stroke-width="3"/>
  <!-- stars -->
  <circle cx="138" cy="24" r="1.6" fill="#fff" opacity="0.95"/>
  <circle cx="160" cy="38" r="1.1" fill="#fff" opacity="0.85"/>
  <circle cx="120" cy="34" r="1.3" fill="#fff" opacity="0.75"/>
  <circle cx="150" cy="18" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="172" cy="26" r="1" fill="#fff" opacity="0.6"/>
  <!-- moon -->
  <circle cx="148" cy="30" r="13" fill="url(#moon)"/>
  <circle cx="154" cy="26" r="13" fill="#24244a"/>
  <!-- mountains -->
  <path d="M10,68 L44,54 L68,68 L100,50 L130,68 L162,54 L190,68 L190,90 L10,90 Z" fill="#24244a"/>
  <path d="M30,68 L60,58 L88,68 L118,56 L148,68 L178,58 L178,90 L30,90 Z" fill="#141420" opacity="0.55"/>
  <!-- thumb -->
  <circle cx="45" cy="50" r="29" fill="url(#thumb)"/>
  <circle cx="45" cy="50" r="28" fill="none" stroke="#3a3a52" stroke-width="1.5"/>
</svg>